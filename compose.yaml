services:
  market-maker:
    build: .
    image: venue-market-maker:local
    restart: unless-stopped
    env_file:
      - .env
    command: ["--config", "config/binance-testnet.json"]
    volumes:
      - ./runtime:/app/runtime
      - ./config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
