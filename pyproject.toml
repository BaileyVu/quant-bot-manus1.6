[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "venue-market-maker"
version = "0.1.0"
description = "Safety-controlled passive market-making service for Binance Spot and Hyperliquid Perpetuals"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Operator"}]
dependencies = [
  "aiohttp==3.11.18",
  "websockets==15.0.1",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "hyperliquid-python-sdk==0.18.0",
  "eth-account==0.13.7",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "ruff==0.11.8",
]

[project.scripts]
market-maker = "market_maker.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
